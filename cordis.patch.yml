# DACW bundle patch: inserts one Host plugin row.
# `id` is the stable row id used by the profile patch layers; `name` resolves to
# this package. `config` values are merged over the plugin's built-in defaults;
# every field lives in plugin.ts (DEFAULT_PLUGIN_CONFIG), and README.md covers
# the main knobs and the writer/reviewer model configuration.
- insert:
    - id: dacw
      name: '@stmcw1/dacw'
      config:
        toolName: dacw_run
        workspace: ''
        workspacePolicy: guarded
        maxRounds: 3
        subagentProvider: spawn
        # 测试执行策略（默认 auto：沙盒开启；Docker 不可用时弹出人类确认，保持/无法确认则 fail-closed，绝不静默降级）
        # sandbox:
        #   mode: auto          # auto（默认）| docker | host（显式 host 无隔离、不询问、有红色警告）
        #   image: ''           # 空 = 按测试命令自动选择官方镜像；也可固定如 node:22-bookworm-slim
        #   memoryMb: 1024
        #   cpus: 1
        #   pidsLimit: 256
        #   tmpfsMb: 128
        # G3 逃生门（默认 false）：允许截断/仅摘要的审查放行 success:true（降低安全保证，message/files/日志会标注）
        # allowTruncatedReview: false
        # 可选：写手/审查者模型（默认继承父会话路由）
        # writerModel: deepseek-account/deepseek-flash   # 或 "deepseek-flash" 按 DSH 已配置模型目录解析 / "inherit"
        # reviewerModel: { model: deepseek-flash, reasoningEffort: high }
